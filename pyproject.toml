[project]
name = "cn-fund-analysis"
version = "0.1.0"
description = "国内公募基金 / ETF 数据分析（AKShare + 本地指标）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14.0",
    "pandas>=2.0.0",
    "typer>=0.12.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
cn-fund = "cn_fund_analysis.__main__:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
